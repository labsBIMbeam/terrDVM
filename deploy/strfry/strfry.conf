# terrCVM corpus relay. Keys not set here keep strfry's compiled-in defaults —
# notably maxFilterLimit = 500, which the geo protocol is designed around
# (VERTICAL-SLICE.md R4).

db = "/app/strfry-db/"

relay {
    # Container: bind wide, the compose port mapping is the boundary.
    bind = "0.0.0.0"
    port = 7777

    info {
        name = "terrcvm-corpus"
        description = "terrCVM corpus relay: kind 30550/30551 announcements from the crawler key. The write policy rejects every other author."
    }

    writePolicy {
        plugin = "/app/write-policy.py"
        timeoutSeconds = 10
    }
}
