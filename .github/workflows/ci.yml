name: CI

# Both halves of the repo run on every push and PR. The TypeScript packages and
# the Python service share cross-language vectors (fixture hashes, kind numbers,
# geohash tables); running only one toolchain lets those pins rot one-directionally
# and stay green until someone happens to run the other suite by hand.
#
# The build step exists again: the napplet split removed apps/napplet (whose
# public/ demo binaries collided with artifactMode:'single-file') and each of
# the three napplets now builds a clean single-file artifact whose build script
# also runs scripts/verify-dist.mjs — single-file, self-contained, and free of
# direct browser network authority. napplet-conformance itself stays a local
# gate (it needs a provisioned Playwright Chromium); verify-dist covers the
# same forbidden-surface scan the conformance CLI runs.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm 10.8.0 comes from the `packageManager` field in the root package.json,
      # provisioned by corepack — same as local development.
      - name: Enable corepack
        run: corepack enable

      # Matches `engines.node` in the root package.json (>=25 <26).
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm -r typecheck

      - name: Unit tests
        run: corepack pnpm -r test:unit

      - name: Build napplet artifacts
        run: corepack pnpm -r build

      - name: Verify shell boundary
        run: node scripts/verify-shell-boundary.mjs

      - name: Verify source policy
        run: node scripts/verify-source-policy.mjs

  python:
    name: python (blossom-gis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/blossom-gis
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/blossom-gis/uv.lock

      # Matches `requires-python` in services/blossom-gis/pyproject.toml (>=3.12).
      # pytest and ruff live in the `dev` optional-dependency group, so the extra
      # is required; --locked fails loudly if uv.lock has drifted from pyproject.toml.
      - name: Install
        run: uv sync --extra dev --locked --python 3.12

      # `--extra dev` is repeated on every `uv run`: without it uv re-syncs the
      # environment to the default dependency set and evicts ruff and pytest,
      # which the sync step above had just installed.
      - name: Ruff
        run: uv run --extra dev --locked ruff check .

      - name: Pytest
        run: uv run --extra dev --locked pytest -q

  # Kept as its own job rather than folded into the one above: terrain-mcp
  # depends on blossom-gis through a path dependency, so its lockfile pins both
  # and `--locked` here is what catches the two drifting apart. Running them in
  # one job would hide that behind a single cache key.
  terrain-mcp:
    name: python (terrain-mcp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/terrain-mcp
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/terrain-mcp/uv.lock

      - name: Install
        run: uv sync --extra dev --locked --python 3.12

      - name: Ruff
        run: uv run --extra dev --locked ruff check .

      - name: Pytest
        run: uv run --extra dev --locked pytest -q
