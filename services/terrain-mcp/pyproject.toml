[project]
name = "terrain-mcp"
version = "0.1.0"
description = "MCP server producing terrain source tiles as Blossom descriptors"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    # Declared rather than inherited from mcp: the tool runs its blocking
    # production path on a worker thread and marshals progress notifications
    # back onto the event loop, so anyio is imported directly here.
    "anyio>=4.5",
    # Every geospatial primitive, codec and storage class comes from the sibling
    # service. Reimplementing tile math or the TFT2 codec here would create a
    # third implementation of an algorithm this repo has already had to pin
    # across two languages by hand.
    "blossom-gis",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
terrain-mcp = "terrain_mcp.server:main"

[tool.uv.sources]
blossom-gis = { path = "../blossom-gis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrain_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
